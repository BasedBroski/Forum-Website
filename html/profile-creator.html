        <!--SearchBox Section-->
        <div class="search-box">
            <div>
                <select name="" id="">
                    <option value="Everything">Everything</option>
                    <option value="Titles">Titles</option>
                    <option value="Descriptions">Descriptions</option>
                </select>
                <input type="text" name="q" placeholder="search ...">
                <button><i class="fa fa-search"></i></button>
            </div>
        </div>
    </header>

    <main class="container mt-4">
        <h2>Create / Edit Profile</h2>
        <form id="profileForm">
            <div class="mb-3">
                <label for="profilePicInput" class="form-label">Profile Picture</label>
                <input class="form-control" type="file" id="profilePicInput" accept="image/*">
                <img id="profilePicPreview" src="" alt="Preview" class="mt-2" style="max-width:150px; display:block;">
            </div>
            <div class="mb-3">
                <label for="profileUsername" class="form-label">Username</label>
                <input type="text" class="form-control" id="profileUsername" placeholder="Your display name">
            </div>
            <div class="mb-3">
                <label for="profileDescription" class="form-label">Description</label>
                <textarea class="form-control" id="profileDescription" rows="3" placeholder="Tell us a bit about yourself"></textarea>
            </div>
            <div class="mb-3">
                <label for="socialTwitter" class="form-label">Twitter URL</label>
                <input type="url" class="form-control" id="socialTwitter" placeholder="https://twitter.com/yourhandle">
            </div>
            <div class="mb-3">
                <label for="socialInstagram" class="form-label">Instagram URL</label>
                <input type="url" class="form-control" id="socialInstagram" placeholder="https://instagram.com/yourhandle">
            </div>
            <button type="button" class="btn btn-primary" id="saveProfile">Save Profile</button>
        </form>
    </main>

    <script src="../js/session.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/profile-creator.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
