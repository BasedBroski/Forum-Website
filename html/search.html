<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Finder</title>
  <link rel="stylesheet" href="../style/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital@1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>

  <!--NavBar Section-->
  <header>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand brand" href="../index.html">JakkerParadise</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
      aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 nav-list">
        <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="board.html">Boards</a></li>
        <li class="nav-item"><a class="nav-link" href="discription.html">Detail</a></li>
        <li class="nav-item"><a class="nav-link" href="search.html">Find Wojaks</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="search-box">
  <div>
    <select name="" id="">
      <option value="Everything">Everything</option>
      <option value="Titles">Titles</option>
      <option value="Descriptions">Descriptions</option>
    </select>
    <input type="text" name="q" placeholder="search ...">
    <button><i class="fa fa-search"></i></button>
  </div>
</div>
</header>

  <main class="container mt-4">
    <h1 class="mb-2">Soyjak Finder</h1>
    <p class="text-muted mb-4">Search for your videos and some images of your favorite soyjaks.</p>

    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-6">
            <label for="searchInput" class="form-label">Search</label>
            <input type="text" class="form-control" id="searchInput" placeholder="Search title, description, tags..." />
          </div>

          <div class="col-md-2">
            <label for="contentTypeFilter" class="form-label">Content</label>
            <select id="contentTypeFilter" class="form-select">
              <option value="all">All</option>
              <option value="videos">Videos</option>
              <option value="images">Images</option>
            </select>
          </div>

          <div class="col-md-2">
            <label for="categoryFilter" class="form-label">Category</label>
            <select id="categoryFilter" class="form-select">
              <option value="all">All Categories</option>
            </select>
          </div>

          <div class="col-md-3">
            <label for="sortFilter" class="form-label">Sort By</label>
            <select id="sortFilter" class="form-select">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="title-asc">Title A-Z</option>
              <option value="title-desc">Title Z-A</option>
            </select>
          </div>

          <div class="col-md-6 d-flex gap-2">
            <button id="searchButton" class="btn btn-primary" type="button">Search</button>
            <button id="clearFiltersButton" class="btn btn-outline-secondary" type="button">Clear</button>
          </div>
        </div>
      </div>
    </section>

    <p id="searchMessage" class="fw-semibold mb-3"></p>

    <section id="videosSection" class="mb-4">
      <h2 class="h5 mb-3">Videos</h2>
      <div id="videoGrid" class="row g-3"></div>
    </section>

    <section id="imagesSection" class="mb-4">
      <h2 class="h5 mb-3">Soyjak Images</h2>
      <p id="soyjakMessage" class="text-muted mb-2">Type to search soyjak images.</p>
      <div id="soyjakGrid" class="row g-3"></div>
    </section>

  </main>

  <div class="modal fade" id="imagePreviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="imagePreviewTitle">Preview</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <img id="imagePreviewImg" src="" alt="Preview" class="img-fluid" style="max-height:75vh;object-fit:contain;">
        </div>
      </div>
    </div>
  </div>
  
  <script src="../js/session.js"></script>
  <script src="../js/main.js"></script>
  <!-- data file lives in data/ rather than js/ -->
  <script src="../data/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/search.js"></script>
</body>

</html>
